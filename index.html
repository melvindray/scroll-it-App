<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scroll-it">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Scroll-it</title>
<style>
:root{--bg:#14110f;--ink:#fbf6ea;--soft:#b9ad9c;--coral:#e4613f;--mustard:#e8b43a;--teal:#3fa7a0;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Rubik,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.item{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.vslot{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center}.item video{position:relative;z-index:1;height:100%;width:100%;object-fit:contain;background:transparent}
.item .poster{position:absolute;inset:0;background:center/cover no-repeat;filter:blur(18px) brightness(.45);transform:scale(1.15)}
.item .meta{z-index:2;position:absolute;inset-inline:0;bottom:0;padding:70px 76px calc(18px + var(--bot)) 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none;direction:rtl;text-align:right}
.meta .film{font-weight:700;font-size:15px}
.meta .chap{font-size:14px;color:var(--soft);margin-top:2px}
.meta .chap b{color:var(--mustard);font-weight:700}
.side{position:absolute;left:10px;bottom:calc(110px + var(--bot));display:flex;flex-direction:column;gap:18px;align-items:center;z-index:3}
.side button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink);text-shadow:0 1px 3px #000}
.side .ic{width:46px;height:46px;border-radius:50%;background:rgba(20,17,15,.55);display:grid;place-items:center;font-size:22px;backdrop-filter:blur(6px)}
.side .on .ic{background:var(--coral)}
.subs{position:absolute;left:70px;right:12px;bottom:calc(150px + var(--bot));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:2}
.subs div{max-width:100%;padding:6px 10px;border-radius:10px;background:rgba(20,17,15,.78);font-size:15px;text-align:center}
.subs .he{direction:rtl;font-size:16px}
.subs .sci{border:2px solid var(--mustard)}
.subs:empty{display:none}
.prog{position:absolute;inset-inline:0;bottom:var(--bot);height:3px;background:rgba(255,255,255,.15);z-index:3}
.prog i{display:block;height:100%;width:0;background:var(--coral)}
.paused::after{content:"▶";position:absolute;inset:0;z-index:2;display:grid;place-items:center;font-size:72px;color:rgba(255,255,255,.75);pointer-events:none}
.heart{position:absolute;font-size:110px;pointer-events:none;animation:hp .8s ease-out forwards;z-index:4}
@keyframes hp{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1) translateY(-60px);opacity:0}}
.badge.lang{top:calc(98px + var(--top));background:var(--plum,#6e4a6b)}.badge{position:absolute;top:calc(64px + var(--top));right:12px;padding:3px 9px;border-radius:99px;background:var(--teal);font-size:12px;font-weight:700;z-index:3}
/* top bar */
#top{position:fixed;top:0;inset-inline:0;z-index:10;padding:calc(8px + var(--top)) 10px 8px;display:flex;gap:8px;align-items:center;background:linear-gradient(rgba(0,0,0,.7),transparent);direction:rtl}
#sys{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
#sys::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.12);font-size:14px}
.pill.on{background:var(--ink);color:var(--bg);font-weight:700}
#menuBtn{font-size:22px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet>div{width:100%;max-height:82vh;overflow:auto;background:#221d19;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--bot));direction:rtl}
.sheet h3{margin:4px 0 12px;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.row label{color:var(--soft);font-size:13px;width:100%}
.seg button{padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.1)}
.seg button.on{background:var(--mustard);color:var(--bg);font-weight:700}
.list .f{padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.list .f>div{font-weight:700}
.list .f small{color:var(--soft)}
.list .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.list .chips button{font-size:13px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1)}
.list .chips button.seen{background:rgba(63,167,160,.35)}
.list .chips button.fav{outline:2px solid var(--coral)}
#start{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px}
#start h1{font-size:44px;margin:0;letter-spacing:-1px}
#start h1 span{color:var(--coral)}
#start p{color:var(--soft);margin:0;max-width:320px}
#start button{padding:14px 34px;border-radius:99px;background:var(--coral);font-size:18px;font-weight:700}
.empty{height:100vh;display:grid;place-items:center;color:var(--soft);text-align:center;padding:30px;direction:rtl}
.item .meta,.subs,.side{transition:transform .3s ease,bottom .3s ease,opacity .25s ease}
.item:not(.ui) .meta{transform:translateY(110%)}
.item:not(.ui) .side{opacity:0;pointer-events:none}
.item:not(.ui) .subs{bottom:calc(16px + var(--bot));left:12px}
</style>
</head>
<body>
<div id="top"><div id="sys"></div><button id="menuBtn" aria-label="תפריט">☰</button></div>
<div id="feed"></div>
<video id="vid" playsinline webkit-playsinline preload="auto"></video>

<div class="sheet" id="menu"><div>
  <h3>הגדרות</h3>
  <div class="row seg" id="langSeg"><label>קול</label><button data-v="he">עברית</button><button data-v="en">English</button></div>
  <div class="row seg" id="subSeg"><label>כתוביות</label><button data-v="he">עברית</button><button data-v="en">English</button><button data-v="both">שתיהן</button><button data-v="off">כבוי</button></div>
  <div class="row seg" id="filtSeg"><label>להציג</label><button data-v="all">הכל</button><button data-v="new">רק מה שלא ראיתי</button><button data-v="fav">מועדפים</button></div>
  <div class="row seg" id="speedSeg"><label>מהירות</label><button data-v="1">1×</button><button data-v="1.25">1.25×</button><button data-v="1.5">1.5×</button></div>
  <h3>שיעורים</h3>
  <div class="list" id="films"></div>
</div></div>

<div id="start"><h1>Scroll<span>-it</span></h1><p>קורס הרפואה שלך, פרק אחרי פרק. גוללים למעלה לפרק הבא.</p><button id="go">▶ מתחילים</button></div>

<script>
const $ = s => document.querySelector(s), feed = $('#feed'), V = $('#vid');
const LS = { get: (k, d) => { try { const v = localStorage.getItem('si_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set: (k, v) => { try { localStorage.setItem('si_' + k, JSON.stringify(v)); } catch {} } };
const st = { lang: LS.get('lang', 'he'), subs: LS.get('subs', 'he'), filt: LS.get('filt', 'all'), speed: LS.get('speed', 1), sys: LS.get('sys', null), seen: LS.get('seen', {}), fav: LS.get('fav', {}), pos: LS.get('pos', {}) };
let SYS = [], DATA = {}, items = [], cur = -1, started = false, io;
const esc = s => String(s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const lines = s => String(s || '').split(/\s+·\s+/).map(esc).join('<br>');
const key = (f, c) => f.id + '/' + c.n;

async function boot() {
  const cfg = await (await fetch('config.json', { cache: 'no-cache' })).json();
  SYS = cfg.systems;
  await Promise.all(SYS.map(async s => { try { const m = await (await fetch(s.base + 'manifest.json', { cache: 'no-cache' })).json(); m.films.forEach(f => f.clips.forEach(c => { for (const l in c.v) c.v[l] = s.base + c.v[l]; })); f_poster(m, s); DATA[s.id] = m; } catch (e) { DATA[s.id] = { films: [] }; } }));
  if (!st.sys || !SYS.find(s => s.id === st.sys)) st.sys = SYS[0].id;
  drawSys(); segs(); build();
}
function f_poster(m, s) { m.films.forEach(f => f.poster = s.base + f.poster); }
function drawSys() {
  $('#sys').innerHTML = SYS.map(s => `<button class="pill ${s.id === st.sys ? 'on' : ''}" data-s="${s.id}">${esc(s.name)}</button>`).join('') + `<button class="pill ${st.sys === '*' ? 'on' : ''}" data-s="*">הכל</button>`;
  $('#sys').querySelectorAll('button').forEach(b => b.onclick = () => { st.sys = b.dataset.s; LS.set('sys', st.sys); drawSys(); build(); });
}
function films() { const ids = st.sys === '*' ? SYS.map(s => s.id) : [st.sys]; return ids.flatMap(id => (DATA[id] || { films: [] }).films.map(f => ({ ...f, sysName: SYS.find(s => s.id === id).name }))); }
function build() {
  pauseAll(); feed.innerHTML = ''; items = []; cur = -1;
  films().forEach(f => f.clips.forEach(c => { const k = key(f, c); if (st.filt === 'new' && st.seen[k]) return; if (st.filt === 'fav' && !st.fav[k]) return; items.push({ f, c, k }); }));
  if (!items.length) { feed.innerHTML = `<div class="empty">${st.filt === 'fav' ? 'אין עדיין מועדפים – לחיצה כפולה על סרטון כדי לשמור.' : st.filt === 'new' ? 'ראית הכל! 🎉' : 'אין עדיין סרטונים במערכת הזאת.'}</div>`; drawFilms(); return; }
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && e.intersectionRatio > 0.6) activate(+e.target.dataset.i); }), { root: feed, threshold: [0.6] });
  items.forEach((it, i) => {
    const d = document.createElement('div'); d.className = 'item'; d.dataset.i = i;
    d.innerHTML = `<div class="poster" style="background-image:url('${it.f.poster}')"></div><div class="vslot"></div>
      ${st.seen[it.k] ? '' : '<div class="badge">חדש</div>'}${it.c.v[st.lang] ? '' : `<div class="badge lang">${st.lang === 'he' ? 'עברית בקרוב · EN' : 'HE only'}</div>`}
      <div class="subs"></div>
      <div class="side"><button class="fv ${st.fav[it.k] ? 'on' : ''}"><span class="ic">♥</span>שמור</button><button class="nx"><span class="ic">⏭</span>הבא</button><button class="ls"><span class="ic">☰</span>פרקים</button><button class="sh"><span class="ic">↗</span>שתף</button></div>
      <div class="meta"><div class="film">${esc(it.f.day.slice(0, 5))} · ${esc(it.f.title)}</div><div class="chap"><b>${it.c.n}/${it.f.clips.length}</b> · ${esc(it.c.title)}${st.sys === '*' ? ' · ' + esc(it.f.sysName) : ''}</div></div>
      <div class="prog"><i></i></div>`;
    feed.appendChild(d); io.observe(d);
    d.querySelector('.fv').onclick = e => { e.stopPropagation(); toggleFav(i); };
    d.querySelector('.nx').onclick = e => { e.stopPropagation(); go(i + 1); };
    d.querySelector('.ls').onclick = e => { e.stopPropagation(); openMenu(); };
    d.querySelector('.sh').onclick = e => { e.stopPropagation(); share(it); };
    let lastTap = 0, tmr;
    d.addEventListener('click', e => { const now = Date.now(); if (now - lastTap < 300) { clearTimeout(tmr); if (!st.fav[it.k]) toggleFav(i); heartAt(d, e); } else tmr = setTimeout(() => togglePlay(i), 260); lastTap = now; });
  });
  // resume where the user stopped
  let start = 0; const p = st.pos[st.sys + st.filt]; if (p) { const j = items.findIndex(x => x.k === p); if (j >= 0) start = j; }
  requestAnimationFrame(() => { feed.scrollTop = start * feed.clientHeight; });
  drawFilms();
}
function el(i) { return feed.children[i]; }
function srcOf(c) { return c.v[st.lang] || c.v.he || c.v.en; }
function pauseAll() { V.pause(); }
let preloader = document.createElement('link'); preloader.rel = 'preload'; preloader.as = 'video';
function activate(i) {
  if (i === cur) return; const prev = cur; cur = i;
  if (prev >= 0 && el(prev)) el(prev).classList.remove('paused', 'ui');
  const it = items[i], d = el(i);
  V.pause(); d.querySelector('.vslot').appendChild(V);
  V.src = srcOf(it.c); V.currentTime = 0; V.playbackRate = st.speed;
  const nx = items[i + 1]; if (nx) { preloader.href = srcOf(nx.c); document.head.appendChild(preloader); }
  st.pos[st.sys + st.filt] = it.k; LS.set('pos', st.pos);
  if (started) play(i);
}
function play(i) { el(i).classList.remove('paused', 'ui'); V.muted = false; V.playbackRate = st.speed; V.play().catch(() => { el(i).classList.add('paused', 'ui'); }); }
function togglePlay(i) { if (i !== cur) return; if (V.paused) play(i); else { V.pause(); el(i).classList.add('paused', 'ui'); } }
V.addEventListener('timeupdate', () => onTime(cur));
V.addEventListener('ended', () => { if (cur >= 0) { markSeen(cur); go(cur + 1); } });
function onTime(i) {
  if (i < 0 || !items[i]) return; const it = items[i], t = V.currentTime, d = el(i);
  d.querySelector('.prog i').style.width = (100 * t / (V.duration || it.c.dur)) + '%';
  const q = it.c.cues.find(c => t >= c.a - 0.2 && t <= c.b + 0.3), s = d.querySelector('.subs');
  const h = !q || st.subs === 'off' ? '' : (st.subs !== 'en' ? `<div class="he ${q.sci ? 'sci' : ''}">${lines(q.he)}</div>` : '') + (st.subs !== 'he' ? `<div class="${q.sci ? 'sci' : ''}">${lines(q.en)}</div>` : '');
  if (s.innerHTML !== h) s.innerHTML = h;
  if (t > (V.duration || it.c.dur) * 0.85) markSeen(i);
}
function go(i) { if (i < items.length) feed.scrollTo({ top: i * feed.clientHeight, behavior: 'smooth' }); }
function markSeen(i) { const k = items[i].k; if (st.seen[k]) return; st.seen[k] = Date.now(); LS.set('seen', st.seen); const b = el(i).querySelector('.badge'); b && b.remove(); }
function toggleFav(i) { const k = items[i].k; if (st.fav[k]) delete st.fav[k]; else st.fav[k] = Date.now(); LS.set('fav', st.fav); el(i).querySelector('.fv').classList.toggle('on', !!st.fav[k]); }
function heartAt(d, e) { const h = document.createElement('div'); h.className = 'heart'; h.textContent = '❤️'; h.style.left = (e.clientX - 55) + 'px'; h.style.top = (e.clientY - 70) + 'px'; d.appendChild(h); setTimeout(() => h.remove(), 800); }
async function share(it) { const url = location.href.split('#')[0] + '#' + it.k; try { if (navigator.share) await navigator.share({ title: 'Scroll-it · ' + it.f.title, text: it.c.title, url }); else { await navigator.clipboard.writeText(url); alert('הקישור הועתק'); } } catch {} }
function segs() {
  [['#langSeg', 'lang', v => { const it = items[cur]; if (it) { const t = V.currentTime, was = !V.paused; V.src = srcOf(it.c); V.addEventListener('loadedmetadata', () => { V.currentTime = t; if (was) play(cur); }, { once: true }); } }], ['#subSeg', 'subs'], ['#filtSeg', 'filt', () => build()], ['#speedSeg', 'speed', () => { V.playbackRate = st.speed; }]].forEach(([sel, k, fn]) => {
    const box = $(sel); const draw = () => box.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(st[k]) === b.dataset.v));
    box.querySelectorAll('button').forEach(b => b.onclick = () => { st[k] = k === 'speed' ? +b.dataset.v : b.dataset.v; LS.set(k, st[k]); draw(); fn && fn(); });
    draw();
  });
}
function drawFilms() {
  $('#films').innerHTML = films().map(f => `<div class="f"><div>${esc(f.day.slice(0, 5))} · ${esc(f.title)}</div><small>${esc(f.sysName)} · ${f.clips.length} פרקים</small><div class="chips">${f.clips.map(c => `<button data-k="${f.id}/${c.n}" class="${st.seen[f.id + '/' + c.n] ? 'seen' : ''} ${st.fav[f.id + '/' + c.n] ? 'fav' : ''}">${c.n} · ${esc(c.title)}</button>`).join('')}</div></div>`).join('');
  $('#films').querySelectorAll('button').forEach(b => b.onclick = () => { closeMenu(); let j = items.findIndex(x => x.k === b.dataset.k); if (j < 0) { st.filt = 'all'; LS.set('filt', 'all'); segs(); build(); j = items.findIndex(x => x.k === b.dataset.k); } setTimeout(() => feed.scrollTo({ top: j * feed.clientHeight }), 50); });
}
function openMenu() { drawFilms(); $('#menu').classList.add('open'); }
function closeMenu() { $('#menu').classList.remove('open'); }
$('#menuBtn').onclick = openMenu; $('#menu').onclick = e => { if (e.target.id === 'menu') closeMenu(); };
$('#go').onclick = () => { started = true; $('#start').remove(); const h = decodeURIComponent(location.hash.slice(1)); if (h) { const j = items.findIndex(x => x.k === h); if (j >= 0) { feed.scrollTop = j * feed.clientHeight; cur = -1; } } if (cur >= 0) play(cur); else activate(Math.round(feed.scrollTop / feed.clientHeight)); };
document.addEventListener('keydown', e => { if (e.key === 'ArrowDown') go(cur + 1); if (e.key === 'ArrowUp') go(Math.max(0, cur - 1)); if (e.key === ' ') { e.preventDefault(); togglePlay(cur); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && cur >= 0) { V.pause(); el(cur).classList.add('paused'); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
</html>
